# boards/esp32s3_devkitc.conf
# ESP32-S3 tweaks merged with prj.conf when building `-b esp32s3_devkitc`.
#
# UNVERIFIED here: this environment lacks the Xtensa toolchain and upstream QEMU
# cannot emulate the ESP32-S3 SoC, so confirm on real hardware. One-time setup +
# build/flash:
#   west blobs fetch hal_espressif
#   west build -b esp32s3_devkitc src/qemu_app -p always
#   west flash                      # real board over USB
#
# Xtensa call frames are wider than x86; give TFLM interpreter setup more stack.
CONFIG_MAIN_STACK_SIZE=16384

# Keep the console on a hardware UART for the 115200-8N1 image protocol.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
